schema_version: 1

context:
  version: "12.2.2"

package:
  name: pyobjc-framework-uniformtypeidentifiers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobjc_framework_uniformtypeidentifiers/pyobjc_framework_uniformtypeidentifiers-${{ version }}.tar.gz
  sha256: 12f8ba77dcc949ffb9f0f48743cae326aebec8e69cb1ac55a1d1e04dca7bd59a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - __osx
    - python >=${{ python_min }}
    - pyobjc-core >=${{ version }}
    - pyobjc-framework-cocoa >=${{ version }}

tests:
  - python:
      imports:
        - UniformTypeIdentifiers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/ronaldoussoren/pyobjc
  summary: Wrappers for the framework UniformTypeIdentifiers on macOS
  documentation: https://pyobjc.readthedocs.io/en/latest/
  license: MIT
  license_file: License.txt

extra:
  recipe-maintainers:
    - GaelTouquet
